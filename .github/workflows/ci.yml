name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: 構文チェック (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # プラグインヘッダで Requires PHP: 8.0 と宣言しているので、
        # 8.0 から現行までを通す。
        php: ['8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: php -l
        run: find themes plugins tests -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

  coding-standards:
    name: WordPress Coding Standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: cs2pr
      # 依存は開発用の数個だけ。第三者のラッパーを挟むより、
      # composer install を直接呼ぶほうが見通しがよく、
      # そのラッパーが内部で使う action の版まで面倒を見なくて済む。
      - name: 依存の取得
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: phpcs
        run: vendor/bin/phpcs --report-full --report-checkstyle=phpcs.xml
      - name: 結果を差分に出す
        if: always()
        run: cs2pr phpcs.xml

  tests:
    name: テスト (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: 依存の取得
        run: composer install --no-interaction --no-progress --prefer-dist --ignore-platform-req=php+
      - name: phpunit
        run: vendor/bin/phpunit --colors=never
